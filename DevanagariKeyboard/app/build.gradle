plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.devakeyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.devakeyboard'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // A fixed debug key, so every new APK can be installed over the old one
    // (no need to uninstall first). For personal use only - not for the Play Store.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
