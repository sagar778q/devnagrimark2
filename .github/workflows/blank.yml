name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run a one-line script
        run: echo Hello, world!

      # Example: create an output folder with something to upload.
      # Replace this with your real build command later (npm run build, etc.)
      - name: Prepare output
        run: |
          mkdir -p output
          cp -r $(ls -A | grep -v -e '^.git$' -e '^output$') output/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devnagrimark2-build
          path: output/
          if-no-files-found: error
